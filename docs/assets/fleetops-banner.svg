<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FleetOps</title>
  <desc id="desc">Agentless Linux diagnostics over SSH, built for the terminal with optional Telegram access.</desc>
  <rect width="1200" height="360" fill="#0d1117"/>
  <g stroke="#21262d" stroke-width="1" opacity="0.8">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M60 0V360M120 0V360M180 0V360M240 0V360M300 0V360M360 0V360M420 0V360M480 0V360M540 0V360M600 0V360M660 0V360M720 0V360M780 0V360M840 0V360M900 0V360M960 0V360M1020 0V360M1080 0V360M1140 0V360"/>
  </g>

  <g transform="translate(70 86)">
    <rect width="154" height="154" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="28" y="27" width="98" height="26" rx="5" fill="#21262d" stroke="#58a6ff"/>
    <circle cx="44" cy="40" r="5" fill="#3fb950"/>
    <path d="M58 40H108" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
    <rect x="28" y="64" width="98" height="26" rx="5" fill="#21262d" stroke="#3fb950"/>
    <circle cx="44" cy="77" r="5" fill="#3fb950"/>
    <path d="M58 77H98" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
    <rect x="28" y="101" width="98" height="26" rx="5" fill="#21262d" stroke="#d29922"/>
    <circle cx="44" cy="114" r="5" fill="#d29922"/>
    <path d="M58 114H113" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="270" y="135" fill="#f0f6fc" font-size="70" font-weight="700">FleetOps</text>
    <text x="273" y="180" fill="#c9d1d9" font-size="25">Agentless Linux diagnostics over SSH</text>
    <text x="273" y="216" fill="#8b949e" font-size="18">Terminal first. Read only. Telegram optional.</text>

    <g font-size="15" font-weight="600">
      <rect x="273" y="251" width="102" height="34" rx="6" fill="#1f6feb"/>
      <text x="294" y="273" fill="#ffffff">CLI first</text>
      <rect x="387" y="251" width="112" height="34" rx="6" fill="#238636"/>
      <text x="405" y="273" fill="#ffffff">Read only</text>
      <rect x="511" y="251" width="142" height="34" rx="6" fill="#9e6a03"/>
      <text x="529" y="273" fill="#ffffff">Self hosted</text>
    </g>
  </g>

  <g transform="translate(805 75)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <path d="M94 68H215M94 68V208M215 68V208M94 208H215" fill="none" stroke="#30363d" stroke-width="2"/>
    <rect x="18" y="40" width="152" height="56" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="42" y="64" fill="#f0f6fc" font-size="14" font-weight="700">Terminal CLI</text>
    <text x="42" y="83" fill="#8b949e" font-size="12">fleetops health</text>
    <rect x="140" y="180" width="152" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="164" y="204" fill="#f0f6fc" font-size="14" font-weight="700">Linux VPS</text>
    <text x="164" y="223" fill="#8b949e" font-size="12">fixed SSH probes</text>
    <rect x="18" y="180" width="98" height="56" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="35" y="204" fill="#f0f6fc" font-size="14" font-weight="700">Telegram</text>
    <text x="35" y="223" fill="#8b949e" font-size="12">optional UI</text>
    <circle cx="94" cy="68" r="7" fill="#58a6ff"/>
    <circle cx="215" cy="208" r="7" fill="#3fb950"/>
    <circle cx="94" cy="208" r="7" fill="#d29922"/>
