<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">FleetOps Telegram preview</title>
  <desc id="desc">A privacy-safe Telegram-style preview of FleetOps health and Docker diagnostics.</desc>
  <rect width="1200" height="650" fill="#e9f0e5"/>
  <g opacity="0.22" fill="#87a878">
    <circle cx="90" cy="80" r="28"/><circle cx="245" cy="170" r="18"/><circle cx="1060" cy="90" r="32"/><circle cx="920" cy="230" r="20"/><circle cx="1080" cy="520" r="26"/><circle cx="160" cy="535" r="32"/>
    <path d="M360 70l18 32-18 32-18-32zM735 520l22 38-22 38-22-38z"/>
  </g>

  <rect width="1200" height="68" fill="#ffffff"/>
  <circle cx="42" cy="34" r="21" fill="#1f6feb"/>
  <path d="M31 34h22M42 23v22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="78" y="31" fill="#17212b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">FleetOps_bot</text>
  <text x="78" y="51" fill="#6c7883" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">bot</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="67" y="100" width="480" height="294" rx="8" fill="#ffffff"/>
    <text x="91" y="132" fill="#17212b" font-size="18" font-weight="700">Server health</text>
    <circle cx="98" cy="163" r="6" fill="#d29922"/>
    <text x="115" y="169" fill="#9a6700" font-size="15" font-weight="700">Overall: WARNING</text>
    <text x="91" y="199" fill="#6c7883" font-size="14">demo.example.com / collected in 0 ms</text>

    <circle cx="98" cy="235" r="5" fill="#3fb950"/>
    <text x="115" y="241" fill="#17212b" font-size="15">Load: 0.76 / 0.61 / 0.57 - 8 CPU</text>
    <circle cx="98" cy="269" r="5" fill="#3fb950"/>
    <text x="115" y="275" fill="#17212b" font-size="15">Memory: 72% used</text>
    <circle cx="98" cy="303" r="5" fill="#d29922"/>
    <text x="115" y="309" fill="#17212b" font-size="15">Disk: / is 87% full</text>
    <circle cx="98" cy="337" r="5" fill="#d29922"/>
    <text x="115" y="343" fill="#17212b" font-size="15">systemd: backup.service failed</text>
    <text x="502" y="376" fill="#89939d" font-size="12">12:42</text>

    <rect x="905" y="116" width="225" height="47" rx="8" fill="#d8f7c7"/>
    <text x="930" y="146" fill="#17212b" font-size="16">/dockerdeep</text>
    <text x="1085" y="151" fill="#6c7883" font-size="11">12:43</text>

    <rect x="620" y="183" width="510" height="340" rx="8" fill="#ffffff"/>
    <text x="644" y="218" fill="#17212b" font-size="18" font-weight="700">Docker deep diagnostics</text>
    <text x="644" y="252" fill="#17212b" font-size="15">2 containers / 1 running / 1 unhealthy</text>

    <text x="644" y="294" fill="#17212b" font-size="15" font-weight="700">Needs attention</text>
    <circle cx="651" cy="324" r="5" fill="#f85149"/>
    <text x="668" y="330" fill="#17212b" font-size="15">api: unhealthy, restarts 3</text>
    <circle cx="651" cy="358" r="5" fill="#d29922"/>
    <text x="668" y="364" fill="#17212b" font-size="15">worker: exit 1, restarts 1</text>

    <text x="644" y="408" fill="#17212b" font-size="15" font-weight="700">Live resource usage</text>
    <rect x="644" y="426" width="462" height="52" rx="6" fill="#f6f8fa"/>
    <text x="660" y="449" fill="#57606a" font-family="Consolas, monospace" font-size="13">api   CPU 1.25%   RAM 128 MiB / 1 GiB</text>
    <text x="660" y="468" fill="#57606a" font-family="Consolas, monospace" font-size="13">compose project: fleetops-demo</text>
    <text x="1085" y="505" fill="#89939d" font-size="11">12:43</text>

    <rect x="67" y="420" width="480" height="76" rx="8" fill="#ffffff"/>
    <text x="91" y="450" fill="#17212b" font-size="14" font-weight="700">Mail / DNS / TLS / Queue / Greylist</text>
    <text x="91" y="477" fill="#6c7883" font-size="14">The same diagnostics, available when you are away.</text>
  </g>

  <rect x="0" y="602" width="1200" height="48" fill="#ffffff"/>
  <text x="32" y="633" fill="#89939d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Telegram is an optional control surface. FleetOps remains terminal-first.</text>
</svg>
